# Amplify Hosting build for the BusKothay web app.
#
# The web app is one workspace inside a monorepo and depends on two shared
# packages, so the build runs from the repository root (`buildPath: /`) while the
# app root stays `apps/web`. `appRoot` must match AMPLIFY_MONOREPO_APP_ROOT in the
# Amplify console.
#
# Set these in the Amplify build environment before the first deployment. The
# build fails rather than shipping a bundle that points at localhost:
#   VITE_API_BASE_URL       the App Runner https origin
#   VITE_MAP_PROVIDER         amazon
#   VITE_AWS_REGION           Amazon Location key region, normally ap-south-1
#   VITE_LOCATION_API_KEY     restricted public Maps V2 + Routes V2 browser key
#
# Afterwards, add the Amplify origin to the API's CORS_ORIGINS and to the map
# key's permitted referrers, then test a preflight request and the map assets.

version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 24 || nvm install 24
            - node --version
            - npm ci
        build:
          commands:
            # Shared packages first: the web build imports their compiled output.
            - npm run build -w @buskothay/geometry
            - npm run build -w @buskothay/shared
            # build:deploy, not build: this is the guarded build that refuses to
            # ship a bundle pointing at localhost or missing the map key.
            - npm run build:deploy -w @buskothay/web
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
