<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111312" />
    <meta
      name="description"
      content="Community bus tracking for AC24, Patuli to Howrah. See where the bus is, when it should reach your stop, and how current that information is."
    />
    <title>BusKothay — Kolkata bus tracker</title>
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('buskothay.theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (error) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,400&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      BusKothay needs JavaScript to show live bus positions on a map.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
