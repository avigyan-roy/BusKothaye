AWSTemplateFormatVersion: '2010-09-09'
Description: BusKothay DynamoDB table for the Lightsail deployment.

Parameters:
  TableName:
    Type: String
    Default: buskothay

Resources:
  JourneyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: BusKothay

Outputs:
  TableName:
    Value: !Ref JourneyTable
  TableArn:
    Value: !GetAtt JourneyTable.Arn
